
name: Databricks CI CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # DEV
  # =========================
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check DEV authentication settings
        run: |
          echo "Authentication type: $DATABRICKS_AUTH_TYPE"

          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is missing"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is missing"
            exit 1
          fi

          echo "DEV settings are configured"

      - name: Test DEV Databricks API
        shell: bash
        run: |
          echo "Testing Databricks API..."

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Accept: application/json" \
            "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Databricks API test failed"
            exit 1
          fi

          echo "Databricks API test successful"

      - name: Test DEV CLI connection
        run: databricks current-user me

      - name: Validate DEV
        run: databricks bundle validate -t dev

      - name: Deploy DEV
        run: databricks bundle deploy -t dev

      - name: Run DEV job
        run: databricks bundle run -t dev sales_job

  # =========================
  # TEST
  # =========================
  deploy-test:
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check TEST authentication settings
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is missing"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is missing"
            exit 1
          fi

          echo "TEST settings are configured"

      - name: Test TEST Databricks API
        shell: bash
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Accept: application/json" \
            "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: TEST API connection failed"
            exit 1
          fi

      - name: Test TEST CLI connection
        run: databricks current-user me

      - name: Validate TEST
        run: databricks bundle validate -t test

      - name: Deploy TEST
        run: databricks bundle deploy -t test

      - name: Run TEST job
        run: databricks bundle run -t test sales_job

  # =========================
  # PROD
  # =========================
  deploy-prod:
    needs: deploy-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check PROD authentication settings
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is missing"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is missing"
            exit 1
          fi

          echo "PROD settings are configured"

      - name: Test PROD Databricks API
        shell: bash
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Accept: application/json" \
            "$DATABRICKS_HOST/api/2.0/preview/scim/v2/Me")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: PROD API connection failed"
            exit 1
          fi

      - name: Test PROD CLI connection
        run: databricks current-user me

      - name: Validate PROD
        run: databricks bundle validate -t prod

      - name: Deploy PROD
        run: databricks bundle deploy -t prod
