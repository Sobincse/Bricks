
name: Databricks CI CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================
  # DEV ENVIRONMENT
  # ==========================
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check DEV authentication settings
        run: |
          echo "Authentication type: $DATABRICKS_AUTH_TYPE"

          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is missing"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is missing"
            exit 1
          fi

          echo "DEV authentication settings are configured"

      - name: Test DEV Databricks connection
        run: databricks current-user me

      - name: Validate DEV
        run: databricks bundle validate -t dev

      - name: Deploy DEV
        run: databricks bundle deploy -t dev

      - name: Run DEV job
        run: databricks bundle run -t dev sales_job

  # ==========================
  # TEST ENVIRONMENT
  # ==========================
  deploy-test:
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check TEST authentication settings
        run: |
          echo "Authentication type: $DATABRICKS_AUTH_TYPE"

          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is missing"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is missing"
            exit 1
          fi

          echo "TEST authentication settings are configured"

      - name: Test TEST Databricks connection
        run: databricks current-user me

      - name: Validate TEST
        run: databricks bundle validate -t test

      - name: Deploy TEST
        run: databricks bundle deploy -t test

      - name: Run TEST job
        run: databricks bundle run -t test sales_job

  # ==========================
  # PROD ENVIRONMENT
  # ==========================
  deploy-prod:
    needs: deploy-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod

    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check PROD authentication settings
        run: |
          echo "Authentication type: $DATABRICKS_AUTH_TYPE"

          if [ -z "$DATABRICKS_HOST" ]; then
            echo "ERROR: DATABRICKS_HOST is missing"
            exit 1
          fi

          if [ -z "$DATABRICKS_TOKEN" ]; then
            echo "ERROR: DATABRICKS_TOKEN is missing"
            exit 1
          fi

          echo "PROD authentication settings are configured"

      - name: Test PROD Databricks connection
        run: databricks current-user me

      - name: Validate PROD
        run: databricks bundle validate -t prod

      - name: Deploy PROD
        run: databricks bundle deploy -t prod
