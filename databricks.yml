bundle:
  name: sales_project

resources:
  jobs:
    sales_job:
      name: sales-transformation
      tasks:
        - task_key: transform
          notebook_task:
            notebook_path: ./notebooks/sales_transformation.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://7474655178410696.azuredatabricks.net

  test:
    mode: production
    workspace:
      host: https://YOUR-TEST-WORKSPACE.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://YOUR-PROD-WORKSPACE.azuredatabricks.net
